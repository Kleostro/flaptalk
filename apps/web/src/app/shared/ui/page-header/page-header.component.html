<div class="ui-page-header">
  <div class="ui-page-header__copy">
    @if (breadcrumbs(); as breadcrumbItems) {
      <app-breadcrumbs [items]="breadcrumbItems" />
    }

    <span class="ui-page-header__kicker">{{ kicker() }}</span>
    <h1 class="ui-page-header__title">{{ title() }}</h1>
  </div>

  <p class="ui-page-header__description">
    {{ description() }}
  </p>
</div>
