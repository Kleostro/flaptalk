<app-page-header
  description="Use setup as the owner hub, then branch into dedicated surfaces for rooms and membership."
  kicker="Owner setup"
  title="Control workspace setup"
/>

@if (!hasWorkspace()) {
  <app-card>
    <div class="workspace-setup-page__panel workspace-setup-page__panel--centered">
      <app-empty-state
        description="Owner setup appears after the first workspace exists."
        kicker="Setup unavailable"
        title="Create a workspace first"
      />
    </div>
  </app-card>
} @else if (!canManageRooms()) {
  <app-card>
    <div class="workspace-setup-page__panel workspace-setup-page__panel--centered">
      <app-empty-state
        description="You can keep using rooms from the workspace, but owner tools stay in the setup area."
        kicker="Owner access"
        title="Setup is limited to workspace owners"
      />
      <a [routerLink]="['/', APP_ROUTE_PATHS.workspace]" class="workspace-setup-page__link-button">
        Return to workspace home
      </a>
    </div>
  </app-card>
} @else {
  <div class="workspace-setup-page__quick-grid">
    <app-shell-section-card tag="Owner" title="Quick actions">
      <div class="workspace-setup-page__panel">
        <div class="workspace-setup-page__action-list">
          <a [routerLink]="roomsLink" class="workspace-setup-page__action-card">
            <span class="workspace-setup-page__action-title">Open rooms</span>
            <span class="workspace-setup-page__action-copy">
              Review existing rooms and open the dedicated room-creation flow.
            </span>
          </a>

          <a [routerLink]="membersLink" class="workspace-setup-page__action-card">
            <span class="workspace-setup-page__action-title">Open members</span>
            <span class="workspace-setup-page__action-copy">
              Manage invite links and review the current member roster in one scope.
            </span>
          </a>
        </div>
      </div>
    </app-shell-section-card>

    <app-shell-section-card tag="Status" title="Setup health">
      <div class="workspace-setup-page__panel">
        <app-key-value-list [items]="setupHealthItems()" />
      </div>
    </app-shell-section-card>
  </div>
}
