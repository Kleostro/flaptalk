<main
  class="auth-page-shell"
  [class.auth-page-shell--login]="mode() === 'login'"
  [class.auth-page-shell--registration]="mode() === 'registration'"
>
  <section class="auth-page-shell__hero">
    <span class="auth-page-shell__eyebrow">{{ eyebrow() }}</span>
    <div class="auth-page-shell__hero-body">
      <h1 class="auth-page-shell__title">{{ title() }}</h1>
      <p class="auth-page-shell__description">{{ description() }}</p>
    </div>
    <div class="auth-page-shell__theme">
      <app-theme-switcher
        [currentTheme]="themeMode()"
        [options]="themeOptions"
        (themeSelected)="setTheme($event)"
      />
    </div>
  </section>

  <div class="auth-page-shell__panel">
    <app-card>
      <div class="auth-page-shell__content">
        <ng-content />

        <p class="auth-page-shell__alternate">
          <span>{{ alternateActionText() }}</span>
          <app-link [route]="alternateActionRoute()">
            {{ alternateActionLabel() }}
          </app-link>
        </p>
      </div>
    </app-card>
  </div>
</main>
