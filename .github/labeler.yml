ci:
  - any:
      - changed-files:
          - any-glob-to-any-file: '.github/*'
          - any-glob-to-any-file: '.husky/*'
          - any-glob-to-any-file: 'husky_scripts/*'
          - any-glob-to-any-file: '.commitlintrc.json'
      - head-branch:
          - '^ci'

chore:
  - any:
      - changed-files:
          - any-glob-to-all-files: '*'
      - head-branch:
          - '^chore'

documentation:
  - changed-files:
      - any-glob-to-any-file: '**/*.md'

feature:
  - head-branch:
      - '^feat'

fix:
  - head-branch:
      - '^fix'
      - '^hotfix'

performance:
  - head-branch:
      - '^perf'

refactor:
  - head-branch:
      - '^refactor'

style:
  - head-branch:
      - '^style'

styling:
  - changed-files:
      - any-glob-to-any-file: '**/*.scss'

sprint1:
  - head-branch: 'FT-01|FTB-01|FTW-01'

sprint2:
  - head-branch: 'FT-02|FTB-02|FTW-02'

sprint3:
  - head-branch: 'FT-03|FTB-03|FTW-03'

sprint4:
  - head-branch: 'FT-04|FTB-04|FTW-04'

sprint5:
  - head-branch: 'FT-05|FTB-05|FTW-05'
