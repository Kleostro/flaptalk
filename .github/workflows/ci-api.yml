name: CI API

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'Dockerfile'
      - 'deploy/**'
      - 'scripts/deploy-api-docker.sh'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'
      - '.github/workflows/ci-api.yml'
      - '.github/workflows/publish-api-image.yml'
      - '.github/workflows/deploy-api-production.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/api/**'
      - 'Dockerfile'
      - 'deploy/**'
      - 'scripts/deploy-api-docker.sh'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'
      - '.github/workflows/ci-api.yml'
      - '.github/workflows/publish-api-image.yml'
      - '.github/workflows/deploy-api-production.yml'

permissions:
  contents: read

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Run API lint
        run: bun run lint:api

      - name: Run API typecheck
        run: bun run typecheck:api

      - name: Build API
        run: bun run build:api
