name: API Uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: Optional healthcheck URL override.
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  healthcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target URL
        id: target
        env:
          INPUT_URL: ${{ inputs.url }}
          DEFAULT_URL: ${{ vars.API_HEALTHCHECK_URL }}
        run: |
          TARGET_URL="${INPUT_URL:-$DEFAULT_URL}"

          if [[ -z "$TARGET_URL" ]]; then
            echo "API_HEALTHCHECK_URL is not configured." >&2
            exit 1
          fi

          echo "url=${TARGET_URL}" >> "$GITHUB_OUTPUT"

      - name: Check API health
        id: check
        run: |
          curl --fail --silent --show-error --max-time 15 "${{ steps.target.outputs.url }}"

      - name: Close previous alert issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'API uptime alert';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });

            const issue = issues.find((entry) => entry.title === title);

            if (!issue) {
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Recovered at ${new Date().toISOString()}. Healthcheck is passing again.`,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
            });

      - name: Open or update alert issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'API uptime alert';
            const body = [
              `Healthcheck failed at ${new Date().toISOString()}.`,
              '',
              `Checked URL: ${{ steps.target.outputs.url }}`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });

            const existing = issues.find((entry) => entry.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
