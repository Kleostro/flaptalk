name: CI Web

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'
      - '.github/workflows/ci-web.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'
      - '.github/workflows/ci-web.yml'

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Run web lint
        run: bun run lint:web

      - name: Run web stylelint
        run: bun run stylelint:web

      - name: Run web typecheck
        run: bun run typecheck:web

      - name: Run web tests
        run: bun run test:web

      - name: Build web
        run: bun run build:web
