name: Deploy API

on:
  workflow_run:
    workflows:
      - Publish API Image
    branches:
      - main
      - develop
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy to.
        required: true
        default: production
        type: choice
        options:
          - production
          - develop
      image_tag:
        description: Optional image tag to deploy. Defaults to the current commit SHA.
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'production' || 'develop') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve target environment
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET_ENV="${{ inputs.environment }}"
          elif [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
            TARGET_ENV="production"
          else
            TARGET_ENV="develop"
          fi

          echo "name=${TARGET_ENV}" >> "$GITHUB_OUTPUT"

      - name: Normalize deploy metadata
        id: deploy
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}/api"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.image_tag }}" ]]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          else
            IMAGE_TAG="${GITHUB_SHA}"
          fi

          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "api_image=${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Create deploy directory on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p /opt/flaptalk/deploy

      - name: Upload deploy assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "deploy/docker-compose.api.yml,scripts/deploy-api-docker.sh"
          target: "/opt/flaptalk"
          strip_components: 0

      - name: Deploy image on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_IMAGE: ${{ steps.deploy.outputs.api_image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: API_IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            chmod +x /opt/flaptalk/scripts/deploy-api-docker.sh
            APP_DIR=/opt/flaptalk \
            ENV_FILE=/etc/flaptalk/api.env \
            COMPOSE_FILE=/opt/flaptalk/deploy/docker-compose.api.yml \
            /opt/flaptalk/scripts/deploy-api-docker.sh

      - name: Verify health endpoint
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            curl --fail --silent http://127.0.0.1:3000/ >/dev/null
