services:
  - type: web
    name: flaptalk-api
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: bun install --frozen-lockfile && bun run --cwd apps/api prisma:generate
    preDeployCommand: bunx --cwd apps/api prisma migrate deploy
    startCommand: bun run start:api
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUN_VERSION
        value: 1.3.10
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
